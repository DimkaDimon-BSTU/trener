<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Подход Тренер</title>
<style>
:root{
  --bg:#EDEFF2;--surface:#FFFFFF;--surface2:#F3F4F7;--ink:#18202B;--muted:#6B7480;--line:#DADEE4;
  --red:#D7392F;--green:#2F9A5A;--blue:#2E62D9;--yellow:#B98712;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --accent:var(--ink);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11151B;--surface:#1B2129;--surface2:#252C36;--ink:#E8ECF1;--muted:#8D96A3;--line:#2E3642;
  --red:#F0574C;--green:#45B873;--blue:#6A95F7;--yellow:#E3B341;color-scheme:dark;
}}
body{--accent:var(--blue)}
body[data-screen=workout]{--accent:var(--red)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
html{scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:640px;margin:0 auto}
main{padding:4px 16px calc(100px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--muted);font:500 11px var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink)}
nav button[aria-current=page] svg{stroke:var(--accent);stroke-width:2.2}
.datebar{display:flex;align-items:center;gap:6px}
.datebar h1{font:700 22px/1.1 var(--num);min-width:7.5em;text-align:center}
.title{font:700 30px/1.1 var(--num);letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:20px;border:0;background:var(--surface);display:grid;place-items:center;font:500 22px/1 var(--num)}
.chip{border:0;border-radius:999px;padding:8px 13px;background:var(--surface2);font:600 14px var(--text);white-space:nowrap}
header .chip{background:var(--surface)}
.board{background:var(--surface);border-radius:22px;padding:18px 18px 16px;margin:6px 0 14px}
.cap{color:var(--muted);font-size:15px}
.big{font:700 52px/1.05 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.025em;margin-top:2px}
.unit{font-size:20px;font-weight:600;letter-spacing:0;color:var(--muted)}
.deficit{color:var(--blue)}.surplus{color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stat b{display:block;font:650 21px/1.2 var(--num);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.ex{background:var(--surface);border-radius:16px;padding:14px 14px 12px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex h3{font:600 17px/1.3 var(--text)}
.prev{color:var(--muted);font-size:14px;margin:3px 0 10px}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{background:var(--surface2);border:0;border-radius:10px;padding:7px 11px;font:600 16px var(--num);font-variant-numeric:tabular-nums}
.set small{color:var(--muted);font-weight:500;font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 17px var(--text);background:var(--ink);color:var(--bg);text-align:center}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink)}
main .btn.ghost{background:var(--surface)}
.btn + .btn{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;text-decoration:underline;padding:0}
.empty{color:var(--muted);text-align:center;padding:28px 16px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h2{font:600 17px var(--text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .meta{font:500 15px var(--num);color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
input,select{font:500 17px var(--text);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none;min-width:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.stepper input{text-align:center;font:700 30px var(--num);padding:8px;font-variant-numeric:tabular-nums}
.stepper button{border:0;border-radius:12px;background:var(--surface2);font:500 26px var(--num)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit}
.row:last-child{border-bottom:0}
.row .meta{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .nm{min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:13px}
.sub{font-size:13px;color:var(--muted);margin:14px 0 2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros b{font:650 20px var(--num);font-variant-numeric:tabular-nums}
.macros span{display:block;color:var(--muted);font-size:13px}
.calc{font:500 16px var(--num);margin:4px 0 14px;font-variant-numeric:tabular-nums}
.calc b{font-size:22px}
canvas{width:100%;height:200px;display:block;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px;vertical-align:-1px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{width:auto;padding:12px 18px}
.sheet-wrap{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;background:rgba(8,12,18,0);display:flex;align-items:flex-end;transition:background .2s;overscroll-behavior:none;touch-action:none}
.sheet-wrap.open{background:rgba(8,12,18,.45)}
.sheet{background:var(--surface);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;transform:translateY(100%);transition:transform .25s ease}
.sheet.dragging{transition:none}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.sheet-wrap.open .sheet{transform:none}
.sheet input,.sheet select,.sheet textarea,.sheet .stepper button,.sheet .chip{background-color:var(--surface2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px;box-shadow:0 0 0 14px transparent}
.sheet h2:first-of-type{padding-top:2px}
.sheet h2{font:700 23px/1.2 var(--num);margin-bottom:4px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#restbar{position:fixed;left:0;right:0;margin:0 auto;width:calc(100% - 16px);max-width:624px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px 12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#restbar[hidden]{display:none}
#restbar.done{background:var(--red);color:#fff}
.rt-info{flex:1;display:flex;flex-direction:column;min-width:0}
.rt-label{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-time{font:700 32px/1 var(--num);font-variant-numeric:tabular-nums}
.rt-btns{display:flex;gap:6px}
.rt-btns button{border:0;border-radius:11px;padding:10px 11px;background:rgba(128,128,128,.28);color:inherit;font:600 15px var(--text)}
.rt-track{flex-basis:100%;height:4px;border-radius:2px;background:rgba(128,128,128,.35);overflow:hidden}
.rt-fill{display:block;height:100%;width:0;background:var(--red);transition:width .25s linear}
#restbar.done .rt-fill{background:#fff}
body.has-timer main{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.count{font:600 14px var(--num);color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ex.complete .count{background:var(--accent);color:#fff}
.goal{font-size:14px;margin-top:3px}
.logrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.logrow input{padding:10px 6px;text-align:center;font:600 19px var(--num);flex:1}
.logrow .x{color:var(--muted);font:500 18px var(--num)}
.logbtn{flex:0 0 54px;height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 21px var(--num)}
.iconbtn.sm{width:46px;height:46px;border-radius:12px;background:var(--surface2);font-size:20px;flex:0 0 46px}
.ex-head .iconbtn.sm{width:32px;height:32px;flex:0 0 32px;font-size:18px;color:var(--muted)}
.iconbtn:disabled{opacity:.35}
.sw-time{font:700 80px/1 var(--num);text-align:center;margin:24px 0;font-variant-numeric:tabular-nums}
.ti{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.ti-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ti-head b{font-weight:600;min-width:0}
.ti-ctl{display:flex;gap:4px;flex:0 0 auto}
.ti-ctl button{width:34px;height:34px;border:0;border-radius:10px;background:var(--surface2);font:600 16px var(--num)}
.ti-ctl button:disabled{opacity:.3}
.grid3{display:grid;grid-template-columns:.8fr 1fr 1.2fr;gap:6px}
.grid3 label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.grid3 input,.grid3 select{padding:9px 8px;font-size:16px}
.grid3 select{padding-right:22px;background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%}
.part{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.part .nm{flex:1;min-width:0}.part .nm small{display:block;color:var(--muted);font-size:13px}
.part input{width:76px;flex:0 0 76px;text-align:center;padding:9px}
.part .iconbtn.sm{width:36px;height:36px;flex:0 0 36px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--muted);font-size:15px}.kv b{font:600 16px var(--num);text-align:right}.kv small{color:var(--muted);font-weight:500}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.weeknav h2{margin:0;flex-direction:column;align-items:center;gap:0}
.weeknav .iconbtn{background:var(--surface2)}
.rec{font-size:15px;padding:3px 0}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.card h2 .chip{font-size:13px;padding:6px 11px}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{flex:1;padding:11px 10px;font-size:15px}
.tpl-start .row .meta{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-wrap,#toast{transition:none}}

.vtitle{font:700 20px/1.2 var(--num);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 14px}
.wday{border:0;background:var(--surface);border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wday span{font-size:12px;color:var(--muted)}.wday b{font:700 19px var(--num)}
.wday b,.mday b{width:30px;height:30px;border-radius:15px;display:grid;place-items:center}
.wday.now b,.mday.now b{color:var(--accent)}
.wday.sel b,.mday.sel b,.wday.sel.now b,.mday.sel.now b{background:var(--accent);color:#fff}
.calmode{margin:2px 0 10px}.calmode .chip{padding:9px 6px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:7px;max-width:34px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dc);display:block}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dc)}
.dots .more{font:700 9px/7px var(--num);font-style:normal;color:var(--muted)}
.month{background:var(--surface);border-radius:18px;padding:8px 6px 10px;margin-bottom:14px}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.mhead span{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 6px}
.mgrid{gap:2px}
.mday{border:0;background:none;border-radius:12px;min-height:56px;padding:3px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mday b{font:600 16px var(--num)}.mday.out{opacity:.35}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}.dayhead h2{font:700 20px var(--num)}
.sess{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;margin-bottom:8px;padding-right:10px;position:relative;overflow:hidden}
.sess::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc)}
.sess.cancel{opacity:.55}
.sess-main{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 4px 12px 16px;text-align:left;min-width:0}
.sess-time{display:flex;flex-direction:column;min-width:52px}.sess-time b{font:700 19px var(--num)}.sess-time small{color:var(--muted);font:500 13px var(--num)}
.sess-info{flex:1;min-width:0;display:flex;flex-direction:column}.sess-info b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sess-info small{color:var(--muted);font-size:13px}
.badge{font:600 12px var(--text);padding:4px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--green)}.badge.warn{color:var(--yellow)}.badge.live{background:var(--red);color:#fff}
.chip.go{background:var(--accent);color:#fff}
.ccard{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;text-align:left}
.ava{flex:0 0 44px;height:44px;border-radius:22px;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--num);color:#fff}
.ava.big{flex-basis:56px;height:56px;border-radius:28px;font-size:20px}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.cinfo b{font-weight:600}.cinfo small{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-style:normal;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}.tag.warn{color:var(--yellow)}.tag.bad{color:var(--red)}
.bad{color:var(--red)}.plus{color:var(--green)}
.chead .crow{display:flex;gap:12px;align-items:center}.chead .crow div{display:flex;flex-direction:column;gap:2px;min-width:0}.cname{font:700 20px/1.2 var(--num)}
.chead .actions{margin-top:14px}
.alert{background:var(--surface2);background:color-mix(in srgb,var(--yellow) 18%,var(--surface));border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.tabs{margin-bottom:12px}.tabs{gap:4px}.tabs .chip{padding:10px 2px;font-size:13px;min-width:0}
.day{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.day-main{flex:1;border:0;background:none;text-align:left;padding:12px 0;display:flex;flex-direction:column;min-width:0}.day-main b{font-weight:600}.day-main small{color:var(--muted);font-size:13px}
.day + .btn{margin-top:10px}
.pcard{display:flex;flex-direction:column;width:100%;border:0;background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:8px;text-align:left}.pcard b{font-weight:600;font-size:17px}.pcard small{color:var(--muted);font-size:14px;margin-top:2px}
.pass{padding:10px 0;border-bottom:1px solid var(--line)}.pass.closed{opacity:.55}.pass-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pass .bar{margin:8px 0 6px}
.pass .iconbtn.sm,.ex-tools .iconbtn.sm{width:32px;height:32px;flex:0 0 32px;font-size:16px;color:var(--muted)}
.pass + .btn{margin-top:12px}
.note{font-size:14px;font-style:italic;background:var(--surface2);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ex-tools{display:flex;align-items:center;gap:6px}
textarea{font:500 16px/1.4 var(--text);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%;resize:vertical;-webkit-appearance:none}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=date],input[type=time]{min-height:48px;text-align:left;display:block}
.grid3b{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:0 8px}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{color:var(--muted);font-weight:600;padding:6px 0;list-style:none}details.more summary::-webkit-details-marker{display:none}details.more summary::after{content:" ›"}
.seg.st .chip{flex:1 1 40%}.seg.wds .chip{flex:1;padding:10px 0;min-width:0}
.card > .btn{margin-top:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}.sw{width:34px;height:34px;border-radius:50%;border:0}.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
</style>
</head>
<body data-screen="schedule">
<header id="top"></header>
<main id="main"></main>

<script>

const WD = ['вс','пн','вт','ср','чт','пт','сб'];
function fmtDay(s){ const [y,m,d] = s.split('-').map(Number); const t = today();
  if (s === t) return 'Сегодня'; if (s === addDays(t,-1)) return 'Вчера'; if (s === addDays(t,1)) return 'Завтра';
  return `${WD[new Date(y,m-1,d).getDay()]}, ${d} ${MONTHS[m-1]}`; }

const passUsed = p => S.sessions.filter(s => s.passId === p.id && counted(s)).length;
function passesOf(cid){ return S.passes.filter(p => p.clientId === cid).sort((a, b) => a.date.localeCompare(b.date)); }

  return rows.sort((a, b) => b.date.localeCompare(a.date)); }
const balance = cid => ledger(cid).reduce((a, r) => a + r.amt, 0);
function passLine(cid){ const p = activePass(cid); if (!p) return '';
  const left = p.total - passUsed(p); return `осталось ${left} из ${p.total}${p.expires ? ` до ${shortDay(p.expires)}` : ''}`; }
const clientSessions = cid => S.sessions.filter(s => s.clientId === cid);
function nextSession(cid){ const t = today(), nowM = new Date().getHours() * 60 + new Date().getMinutes();
  return clientSessions(cid).filter(s => s.status === 'planned' && (s.date > t || (s.date === t && toMin(s.time) + Number(s.dur) >= nowM)))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0]; }
const sessLabel = s => `${fmtDay(s.date).toLowerCase()} в ${s.time}`;
const clientWorkouts = cid => S.workouts.filter(w => w.clientId === cid).sort((a, b) => (b.date + (b.startedAt || 0)).localeCompare(a.date + (a.startedAt || 0)));

/* ---------- навигация ---------- */

const back = () => { VIEW.pop(); render(); };

/* ---------- шторка снизу ---------- */
// Фон под шторкой фиксируется, чтобы не прокручивался. Шторку можно смахнуть вниз.
let lockY = 0;
function lockPage(){ if (document.body.classList.contains('locked')) return; lockY = window.scrollY;
  document.body.style.top = -lockY + 'px'; document.body.classList.add('locked'); }
function unlockPage(){ if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked'); document.body.style.top = ''; window.scrollTo(0, lockY); }
function sheet(html, opt = {}){
  document.querySelectorAll('.sheet-wrap').forEach(w => w.remove());
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  const sh = w.querySelector('.sheet');

    if (!maybe) return; dy = e.touches[0].clientY - y0;

      else if (dy < -6) { maybe = false; return; } else return; }
    e.preventDefault(); sh.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });

  else { document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('open')); } return sh; }

if (window.visualViewport) { const vv = visualViewport;

  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit(); }

const fmtClock = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
const fmtDur = min => min >= 60 ? `${Math.floor(min / 60)} ч ${pad(min % 60)} мин` : `${min} мин`;
let AC = null; const beeps = {};
function audio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function cancelBeep(key){ for (const o of beeps[key] || []) { try { o.stop(); } catch (e) {} } beeps[key] = []; }
function scheduleBeep(inSec, key){ cancelBeep(key); const ac = audio(); if (!ac) return; const t0 = ac.currentTime + Math.max(0.05, inSec); beeps[key] = [];
  for (let i = 0; i < 3; i++) { const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * 0.3;
    o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.26); beeps[key].push(o); } }
/* ---------- тренировка ---------- */
function restFor(it){ const v = it && it.rest !== undefined && it.rest !== '' && it.rest !== null ? Number(it.rest) : num(S.settings.rest); return v > 0 ? v : 0; }
function startRest(sec){ if (!(sec > 0)) return; S.timer = { end: Date.now() + sec * 1000, total: sec }; save(); scheduleBeep(sec, 'rest'); tick(); }
function adjustRest(d){ const t = S.timer; if (!t) return; if (d === 0) { S.timer = null; cancelBeep('rest'); save(); tick(); return; }
  t.end += d * 1000; t.total = Math.max(5, t.total + d); const left = (t.end - Date.now()) / 1000;
  if (left <= 0) { S.timer = null; cancelBeep('rest'); } else { t.rang = false; scheduleBeep(left, 'rest'); } save(); tick(); }
const lastAct = w => Math.max(w.startedAt || 0, ...w.sets.map(s => s.t || 0));
const isLive = w => !!(w && w.startedAt && !w.finishedAt && Date.now() - lastAct(w) < 4 * 3600e3);
const liveWorkout = () => S.workouts.find(isLive);
let tickT = null;
function tick(){
  if (!S) return; const bar = $('#restbar'), t = S.timer, lw = liveWorkout();
  const wc = $('#wclock'), cur = VIEW.at(-1); if (wc && cur && cur.t === 'workout') { const w = S.workouts.find(x => x.id === cur.id); if (isLive(w)) wc.textContent = fmtClock((Date.now() - w.startedAt) / 1000); }
  if (!t) { bar.hidden = true; document.body.classList.remove('has-timer'); }
  else { const left = (t.end - Date.now()) / 1000; bar.hidden = false; document.body.classList.add('has-timer');
    if (left <= 0) { bar.classList.add('done'); bar.querySelector('.rt-label').textContent = 'Отдых окончен, вперёд!'; bar.querySelector('.rt-time').textContent = '0:00'; bar.querySelector('.rt-fill').style.width = '100%';
      if (!t.rang) { t.rang = true; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }

    else { bar.classList.remove('done'); bar.querySelector('.rt-label').textContent = 'Отдых'; bar.querySelector('.rt-time').textContent = fmtClock(Math.ceil(left));
      bar.querySelector('.rt-fill').style.width = `${Math.min(100, 100 - left / t.total * 100)}%`; } }

}
let wakeL = null;

function lastSetsOf(cid, exId, w){ const key = x => x.date + String(x.startedAt || 0).padStart(15, '0');
  const list = S.workouts.filter(x => x.clientId === cid && x !== w && key(x) < key(w)).sort((a, b) => key(b).localeCompare(key(a)));
  for (const x of list) { const ss = x.sets.filter(s => s.exId === exId); if (ss.length) return { date: x.date, sets: ss }; } return null; }

  exnote: t => openExNote(t.dataset.ex),
  rmex: t => { const w = curWorkout(); if (!w) return; w.plan = wkPlan(w).filter(i => i.exId !== t.dataset.ex); touch(w); save(); render(); },
  delset: t => { const w = curWorkout(); const s = w && w.sets.find(x => x.id === t.dataset.id); if (!s || !confirm(`Удалить подход ${setTxt(s)}?`)) return; w.sets = w.sets.filter(x => x !== s); touch(w); save(); render(); },
  finish: () => finishWorkout(),
  pickex: () => openExPicker(),
  rest: t => adjustRest(Number(t.dataset.d)),
  fm: t => { FM = Math.min(0, FM + Number(t.dataset.d)); render(); },
  myex: () => openMyExercises(),
  export: () => exportData(),
  import: () => $('#importFile').click(),
};
document.addEventListener('click', e => {
  if (e.target.closest('.sheet')) return;
  const t = e.target.closest('button[data-act],button[data-tab]'); if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; VIEW = []; render(); scrollTo(0, 0); return; }
  const fn = ACTIONS[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('keydown', e => { const t = e.target; if (e.key === 'Enter' && t.dataset && t.dataset.log) { e.preventDefault(); logSet(t.dataset.log); } });
document.addEventListener('input', e => { if (e.target.id === 'cq') { CQ = e.target.value; const l = $('#clist'); if (l) l.innerHTML = clientListHtml(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pex') { PEX = t.value; requestAnimationFrame(drawClientProgress); }
  else if (t.id === 'wnote') { const w = curWorkout(); if (w) { w.note = t.value.trim(); touch(w); save(); } }
  else if (t.id === 'pname') { const p = curProg(); if (p && t.value.trim()) { p.name = t.value.trim(); touch(p); save(); $('.vtitle').textContent = p.name; } }
  else if (t.id === 'importFile') { importData(t.files[0]); t.value = ''; }
  else if (t.dataset.st) { S.settings[t.dataset.st] = t.value.trim(); save(); }
});
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const v = VIEW.at(-1); if (v && v.t === 'client' && CTAB === 'progress') drawClientProgress(); }, 150); });

/* ---------- запуск ---------- */
(async () => {
  try { await store.open(); S = await store.get('state'); }
  catch (e) { store.db = null; try { S = JSON.parse(localStorage.getItem('trener') || 'null'); } catch (e2) { S = null; } }
  if (!S) S = freshState();
  migrate(S); render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) {
    const hadCtl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtl || reloaded) return; reloaded = true; persist().then(() => location.reload()); });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}); }
})();

</script>
</body>
